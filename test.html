<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body, html{
            width:100%;
            height:100%;
        }
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        .box{
            width: 20px;
            height: 20px;
            border-radius: 100%;
            background-color: rgb(0, 0, 0);
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none; 
        }
        body {
        cursor: none;
        }


    </style>
</head>
<body>
    <div class="box"></div>

    <!-- checking -->


    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <script>
        gsap.set(".box", {xPercent: -50, yPercent: -50});

        
        let xTo = gsap.quickTo(".box", "x", {duration: 0.4, ease: "power3"});
        let yTo = gsap.quickTo(".box", "y", {duration: 0.4, ease: "power3"});

        
        window.addEventListener("mousemove", (e) => {
            
            xTo(e.clientX);
            yTo(e.clientY);
        });
    </script>
    
</body>
</html>
